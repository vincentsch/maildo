name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    # Windows is not supported yet. `make lint` in the checks job vets the
    # Windows build, so the code still compiles there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check formatting and vet
        run: make lint
      - name: Check whitespace
        run: git diff --check
      - name: Race test
        run: make race
      - name: Check command docs
        run: make docs-check
      - name: Check doc links
        run: make docs-links
      - name: Check command conformance
        run: make conformance
      - name: Cross-build release targets
        run: make build-all

  integration:
    # Runs every IMAP and SMTP command against real Dovecot and GreenMail
    # servers in Docker. Kept apart from the fast unit tests above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Test against Dovecot and GreenMail
        run: make integration
